<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Location | Mausam</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<main class="onboarding">

    <div class="onboarding-card">

        <!-- BRAND -->

        <div class="onboarding-brand">

            <div class="brand-icon">
                M
            </div>

            <div>
                <h2>MAUSAM</h2>
                <span>Personalized Weather</span>
            </div>

        </div>


        <!-- PROGRESS -->

        <div class="onboarding-progress">

            <span class="progress-active"></span>
            <span class="progress-active"></span>
            <span class="progress-active"></span>

        </div>


        <!-- CONTENT -->

        <section class="onboarding-content">

            <p class="eyebrow">
                YOUR LOCATION
            </p>

            <h1>
                Where are you?
            </h1>

            <p class="onboarding-subtitle">
                We'll use your location to provide
                accurate weather forecasts, alerts and
                personalized recommendations.
            </p>


            <!-- CURRENT LOCATION -->

            <button
                class="location-option"
                id="current-location">

                <div class="location-option-icon">
                    📍
                </div>

                <div>

                    <strong>
                        Use my current location
                    </strong>

                    <small>
                        Automatically detect your location
                    </small>

                </div>

                <span class="location-arrow">
                    →
                </span>

            </button>


            <!-- DIVIDER -->

            <div class="location-divider">
                <span>OR</span>
            </div>


            <!-- CITY SEARCH -->

            <div class="location-search">

                <span>🔍</span>

                <input
                    type="text"
                    id="city-input"
                    placeholder="Search any city"
                    autocomplete="off">

            </div>


            <div
                id="location-results"
                class="location-results">
            </div>


            <!-- SELECTED LOCATION -->

            <div
                id="selected-location"
                class="selected-location">

                <span>📍</span>

                <div>

                    <strong id="selected-city"></strong>

                    <small id="selected-state"></small>

                </div>

                <button
                    id="change-location"
                    type="button">

                    Change

                </button>

            </div>


            <!-- ACTION -->

            <div class="onboarding-actions">

                <span id="location-status">
                    Choose a location
                </span>

                <button
                    id="finish-btn"
                    class="primary-btn"
                    disabled>

                    Continue →

                </button>

            </div>

        </section>

    </div>

</main>


<script type="module">

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import {
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

import {
    auth,
    db
} from "{{ url_for('static', filename='js/firebase.js') }}";


/* =========================
   ELEMENTS
   ========================= */

const currentLocationButton =
    document.getElementById(
        "current-location"
    );

const cityInput =
    document.getElementById(
        "city-input"
    );

const locationResults =
    document.getElementById(
        "location-results"
    );

const selectedLocation =
    document.getElementById(
        "selected-location"
    );

const selectedCity =
    document.getElementById(
        "selected-city"
    );

const selectedState =
    document.getElementById(
        "selected-state"
    );

const locationStatus =
    document.getElementById(
        "location-status"
    );

const finishButton =
    document.getElementById(
        "finish-btn"
    );

const changeLocation =
    document.getElementById(
        "change-location"
    );


let currentUser = null;

let locationData = null;


/* =========================
   AUTH CHECK
   ========================= */

onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            window.location.href =
                "/signup";

            return;

        }

        currentUser = user;

        console.log(
            "Logged-in user:",
            currentUser.uid
        );

    }
);


/* =========================
   SEARCH ANY CITY
   ========================= */

let searchTimeout = null;


cityInput.addEventListener(
    "input",
    () => {

        const query =
            cityInput.value.trim();


        locationResults.innerHTML = "";


        if (query.length < 2) {

            return;

        }


        clearTimeout(
            searchTimeout
        );


        searchTimeout =
            setTimeout(
                () => {

                    searchCities(
                        query
                    );

                },
                400
            );

    }
);


/* =========================
   GEOCODING SEARCH
   ========================= */

async function searchCities(query) {

    try {

        locationResults.innerHTML = `
            <div class="location-result">
                Searching...
            </div>
        `;


        const url =
            "https://geocoding-api.open-meteo.com/v1/search" +
            `?name=${encodeURIComponent(query)}` +
            "&count=8" +
            "&language=en" +
            "&format=json";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Geocoding request failed"
            );

        }


        const data =
            await response.json();


        locationResults.innerHTML = "";


        if (
            !data.results ||
            data.results.length === 0
        ) {

            locationResults.innerHTML = `
                <div class="location-result">
                    No cities found.
                </div>
            `;

            return;

        }


        data.results.forEach(
            (place) => {

                const result =
                    document.createElement(
                        "button"
                    );


                result.type = "button";

                result.className =
                    "location-result";


                const city =
                    place.name ||
                    "Unknown city";


                const state =
                    place.admin1 ||
                    place.admin2 ||
                    "";


                const country =
                    place.country ||
                    "";


                result.innerHTML = `

                    <span>📍</span>

                    <div>

                        <strong>
                            ${city}
                        </strong>

                        <small>
                            ${state
                                ? `${state}, `
                                : ""
                            }${country}
                        </small>

                    </div>

                `;


                result.addEventListener(
                    "click",
                    () => {

                        selectLocation({

                            city:
                                city,

                            state:
                                state ||
                                country,

                            latitude:
                                place.latitude,

                            longitude:
                                place.longitude

                        });

                    }
                );


                locationResults.appendChild(
                    result
                );

            }
        );


    } catch (error) {

        console.error(
            "City search error:",
            error
        );


        locationResults.innerHTML = `
            <div class="location-result">
                Could not search cities.
                Please try again.
            </div>
        `;

    }

}


/* =========================
   SELECT LOCATION
   ========================= */

function selectLocation(location) {

    locationData =
        location;


    selectedCity.textContent =
        location.city;


    selectedState.textContent =
        location.state;


    selectedLocation.classList.add(
        "visible"
    );


    locationStatus.textContent =
        `${location.city}, ${location.state}`;


    finishButton.disabled =
        false;


    locationResults.innerHTML =
        "";


    cityInput.value =
        "";


    console.log(
        "Selected location:",
        location
    );

}


/* =========================
   CURRENT LOCATION
   ========================= */

currentLocationButton.addEventListener(
    "click",
    () => {

        if (!navigator.geolocation) {

            alert(
                "Location detection is not supported."
            );

            return;

        }


        currentLocationButton.innerHTML = `

            <div class="location-option-icon">
                ⏳
            </div>

            <div>

                <strong>
                    Detecting location...
                </strong>

                <small>
                    Please allow location access
                </small>

            </div>

        `;


        navigator.geolocation.getCurrentPosition(

            async (position) => {

                const latitude =
                    position.coords.latitude;


                const longitude =
                    position.coords.longitude;


                console.log(
                    "GPS coordinates:",
                    latitude,
                    longitude
                );


                try {

                    currentLocationButton.innerHTML = `

                        <div class="location-option-icon">
                            ⏳
                        </div>

                        <div>

                            <strong>
                                Finding your city...
                            </strong>

                            <small>
                                Getting location details
                            </small>

                        </div>

                    `;


                    const response =
                        await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&zoom=10&addressdetails=1`
                        );


                    if (!response.ok) {

                        throw new Error(
                            `Location lookup failed: HTTP ${response.status}`
                        );

                    }


                    const data =
                        await response.json();


                    const address =
                        data.address;


                    if (!address) {

                        throw new Error(
                            "No address returned"
                        );

                    }


                    const city =
                        address.city ||
                        address.town ||
                        address.village ||
                        address.municipality ||
                        address.county ||
                        "Unknown city";


                    const state =
                        address.state ||
                        address.state_district ||
                        "Unknown state";


                    selectLocation({

                        city:
                            city,

                        state:
                            state,

                        latitude:
                            latitude,

                        longitude:
                            longitude

                    });


                    currentLocationButton.innerHTML = `

                        <div class="location-option-icon">
                            📍
                        </div>

                        <div>

                            <strong>
                                Location detected
                            </strong>

                            <small>
                                ${city}, ${state}
                            </small>

                        </div>

                    `;


                } catch (error) {

                    console.error(
                        "Location lookup error:",
                        error
                    );


                    alert(
                        "We detected your coordinates, but couldn't determine the city name. You can search for your city manually."
                    );


                    currentLocationButton.innerHTML = `

                        <div class="location-option-icon">
                            📍
                        </div>

                        <div>

                            <strong>
                                Use my current location
                            </strong>

                            <small>
                                Automatically detect your location
                            </small>

                        </div>

                        <span class="location-arrow">
                            →
                        </span>

                    `;

                }

            },


            () => {

                alert(
                    "Location permission was denied."
                );


                currentLocationButton.innerHTML = `

                    <div class="location-option-icon">
                        📍
                    </div>

                    <div>

                        <strong>
                            Use my current location
                        </strong>

                        <small>
                            Automatically detect your location
                        </small>

                    </div>

                    <span class="location-arrow">
                        →
                    </span>

                `;

            }

        );

    }
);


/* =========================
   CHANGE LOCATION
   ========================= */

changeLocation.addEventListener(
    "click",
    () => {

        locationData =
            null;


        selectedLocation.classList.remove(
            "visible"
        );


        finishButton.disabled =
            true;


        locationStatus.textContent =
            "Choose a location";


        cityInput.focus();

    }
);


/* =========================
   SAVE LOCATION
   ========================= */

finishButton.addEventListener(
    "click",
    async () => {

        if (
            !currentUser ||
            !locationData
        ) {

            return;

        }


        try {

            finishButton.disabled =
                true;


            finishButton.textContent =
                "Saving...";


            const userRef =
                doc(
                    db,
                    "users",
                    currentUser.uid
                );


            await updateDoc(
                userRef,
                {

                    location: {

                        city:
                            locationData.city,

                        state:
                            locationData.state,

                        latitude:
                            locationData.latitude,

                        longitude:
                            locationData.longitude

                    }

                }
            );


            console.log(
                "Location saved successfully:",
                locationData
            );


            /*
             * IMPORTANT:
             *
             * We no longer use localStorage.
             * We also don't send coordinates
             * through /home?lat=...&lon=...
             *
             * Flask will get the location from
             * Firestore using the logged-in UID.
             */


            window.location.href =
                "/home";


        } catch (error) {

            console.error(
                "Location save error:",
                error
            );


            alert(
                "Could not save your location. Please try again."
            );


            finishButton.disabled =
                false;


            finishButton.textContent =
                "Continue →";

        }

    }
);

</script>

</body>

</html>
