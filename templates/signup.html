<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Mausam</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<main class="onboarding">

    <div class="onboarding-card">

        <div class="onboarding-brand">

            <div class="brand-icon">
                M
            </div>

            <div>
                <h2>MAUSAM</h2>
                <span>Personalized Weather</span>
            </div>

        </div>


        <section class="onboarding-content">

            <p class="eyebrow">
                WELCOME TO MAUSAM
            </p>

            <h1>
                Create your account
            </h1>

            <p class="onboarding-subtitle">
                Your account lets Mausam remember your
                preferences and personalize your weather
                experience.
            </p>


           <form id="signup-form">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="Your name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="At least 6 characters"
                        minlength="6"
                        required>

                </div>


                <button
                    type="submit"
                    class="primary-btn">

                    Create account →

                </button>

            </form>

        </section>

    </div>

</main>


<script
    type="module"
    src="{{ url_for('static', filename='js/auth.js') }}">
</script>

</body>

</html>
